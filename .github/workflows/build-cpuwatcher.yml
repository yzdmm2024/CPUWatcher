name: build-cpuwatcher

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos dependencies
        run: |
          brew install ldid dpkg xz perl || true

      - name: Install Theos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          export THEOS=$HOME/theos
          $THEOS/bin/update-theos
          mkdir -p $HOME/theos/sdks
          gh release download -R theos/sdks -p "iPhoneOS14.5.sdk.tar.xz" -D /tmp
          tar -xJf /tmp/iPhoneOS14.5.sdk.tar.xz -C $HOME/theos/sdks/
          ln -sf "$HOME/theos/sdks/iPhoneOS14.5.sdk" "$HOME/theos/sdks/iPhoneOS14.0.sdk"

      - name: Build with Theos
        run: |
          export THEOS=$HOME/theos
          rm -rf .theos
          make
          echo "=== Build output ==="
          find .theos -type f -name "*.dylib" -o -type f -name "cpuwatchctl" -o -type f -name "CPUWatcherPrefs" | head -30

      - name: Prepare VERSION
        id: ver
        run: |
          VERSION=$(grep '^Version:' control | awk '{print $2}' | tr -d '\r\n ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "版本号: [$VERSION]"

      - name: Package deb (manual staging)
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.version }}"
          JB=stage/var/jb

          # ---- TweakInject：悬浮窗 dylib + 对应 Filter plist
          #      Filter 的 basename 必须与 dylib 同名，否则 ElleKit 找不到过滤器。
          mkdir -p $JB/usr/lib/TweakInject
          cp .theos/obj/debug/CPUWatcherHUD.dylib $JB/usr/lib/TweakInject/ 2>/dev/null || \
          cp .theos/obj/CPUWatcherHUD.dylib $JB/usr/lib/TweakInject/ || { echo "FATAL: CPUWatcherHUD.dylib 缺失"; exit 1; }
          cp layout/Library/MobileSubstrate/DynamicLibraries/CPUWatcherHUD.plist $JB/usr/lib/TweakInject/

          # ---- 特权助手：setuid root 是跨进程采样的唯一权限来源
          mkdir -p $JB/usr/bin
          cp .theos/obj/debug/cpuwatchctl $JB/usr/bin/ 2>/dev/null || \
          cp .theos/obj/cpuwatchctl $JB/usr/bin/ || { echo "FATAL: cpuwatchctl 缺失"; exit 1; }

          # ---- 设置面板：先铺 layout（手写 Info.plist），再单独拷可执行文件。
          #      不能整目录覆盖 .theos 的 bundle，否则 NSPrincipalClass 会被冲掉，面板直接消失。
          mkdir -p $JB/Library/PreferenceBundles
          cp -R layout/Library/PreferenceBundles/CPUWatcherPrefs.bundle $JB/Library/PreferenceBundles/
          cp .theos/obj/debug/CPUWatcherPrefs.bundle/CPUWatcherPrefs $JB/Library/PreferenceBundles/CPUWatcherPrefs.bundle/ 2>/dev/null || \
          cp .theos/obj/CPUWatcherPrefs.bundle/CPUWatcherPrefs $JB/Library/PreferenceBundles/CPUWatcherPrefs.bundle/ || { echo "FATAL: CPUWatcherPrefs 可执行文件缺失"; exit 1; }

          # ---- 同步版本号进面板 bundle。面板里「版本」那一行读的就是这个值，
          #      不同步的话会出现「面板显示旧版本」的假象，很难排查。
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" \
              $JB/Library/PreferenceBundles/CPUWatcherPrefs.bundle/Info.plist

          # ---- PreferenceLoader 入口
          mkdir -p $JB/Library/PreferenceLoader/Preferences
          cp layout/Library/PreferenceLoader/Preferences/CPUWatcher.plist $JB/Library/PreferenceLoader/Preferences/

          # ---- 签名：helper 用专用 entitlements，其余走 adhoc 兜底
          #      theos 通常已签，这里重签一次确保 entitlements 一定进去。
          ldid -Sentitlements/cpuwatchctl.entitlements $JB/usr/bin/cpuwatchctl
          find stage -type f \( -name "*.dylib" -o -name "CPUWatcherPrefs" \) -exec ldid -S {} \;
          chmod 4755 $JB/usr/bin/cpuwatchctl

          # ---- postinst
          mkdir -p stage/DEBIAN
          cp control stage/DEBIAN/control
          sed -i '' "s/^Version:.*/Version: $VERSION/" stage/DEBIAN/control
          cp DEBIAN/postinst stage/DEBIAN/postinst
          chmod 0755 stage/DEBIAN/postinst

          echo "=== Stage layout ==="
          find stage -type f | sort
          echo "=== helper 权限位 ==="
          ls -l $JB/usr/bin/cpuwatchctl

      # ---------------------------------------------------------------------
      # 护栏区：任何一条不过就直接失败，不让有风险的包出去。
      # ---------------------------------------------------------------------
      - name: "Guard 1/7: 产物里绝不能有 LaunchDaemon（白苹果防护第 1 条）"
        run: |
          if find stage -path "*LaunchDaemon*" -o -path "*LaunchAgent*" | grep -q .; then
            echo "FATAL: 产物里出现了 LaunchDaemon/LaunchAgent —— 违反「开机零执行」约束"
            find stage -path "*LaunchDaemon*" -o -path "*LaunchAgent*"
            exit 1
          fi
          echo "OK: 无任何开机自启项"

      - name: "Guard 2/7: postinst 不许自动重启桌面"
        run: |
          # 只看真实命令，忽略注释行，避免把说明文字误判成动作。
          if grep -vE '^[[:space:]]*#' stage/DEBIAN/postinst | grep -qiE 'killall|sbreload|respring'; then
            echo "FATAL: postinst 里有自动重启桌面的动作"
            grep -vE '^[[:space:]]*#' stage/DEBIAN/postinst | grep -inE 'killall|sbreload|respring'
            exit 1
          fi
          echo "OK: postinst 不含自动重启桌面"

      - name: "Guard 3/7: cpuwatchctl 必须是 setuid root(4755)"
        run: |
          HELPER=stage/var/jb/usr/bin/cpuwatchctl
          # ⚠️ macOS 的 `stat -f "%Lp"` 只给 rwx 三位（返回 755），不含 setuid。
          #    必须用 %p 取完整的八进制权限再和 07777 做掩码，否则永远判错。
          PERM_OCT=$(stat -f "%p" "$HELPER")
          MODE=$(printf "%o" $(( 8#$PERM_OCT & 8#7777 )))
          echo "mode = $MODE   (stat %p = $PERM_OCT, ls = $(ls -l "$HELPER" | awk '{print $1}'))"
          if [ "$MODE" != "4755" ]; then echo "FATAL: setuid 位没保住，跨进程采样会全部失败"; exit 1; fi
          echo "OK: setuid root 已就位"

      - name: "Guard 4/7: 熵权限必须真的写进签名"
        run: |
          ldid -e stage/var/jb/usr/bin/cpuwatchctl > /tmp/ent.plist
          cat /tmp/ent.plist
          grep -q "platform-application" /tmp/ent.plist || { echo "FATAL: 缺 platform-application"; exit 1; }
          grep -q "task_for_pid-allow" /tmp/ent.plist  || { echo "FATAL: 缺 task_for_pid-allow"; exit 1; }
          echo "OK: entitlements 已写入二进制"

      - name: "Guard 5/7: 架构必须是 fat(arm64 + arm64e)"
        run: |
          for f in stage/var/jb/usr/lib/TweakInject/CPUWatcherHUD.dylib \
                   stage/var/jb/usr/bin/cpuwatchctl \
                   stage/var/jb/Library/PreferenceBundles/CPUWatcherPrefs.bundle/CPUWatcherPrefs; do
            N=$(lipo -archs "$f" | wc -w | tr -d ' ')
            echo "$f -> $(lipo -archs "$f")"
            if [ "$N" -lt 2 ]; then echo "FATAL: $f 不是 fat 双架构，jbroot 下会加载失败"; exit 1; fi
          done
          echo "OK: 三个二进制均为 fat"

      - name: "Guard 6/7: 面板 bundle 必须带 Root.plist（少了它面板整片空白）"
        run: |
          # 实机踩过的坑：prefs bundle 里没有 Root.plist 时，
          # -reloadSpecifiers 会重新走 loadSpecifiersFromPlistName: 拿到空数组，
          # 把代码刚设好的 specifiers 整个覆盖掉。
          # 症状 = 「设置 → CPU 监视器」点进去一片空白。
          # frida 实测：set 之后读出 2 条 -> reload 之后读出 0 条。
          ROOT=stage/var/jb/Library/PreferenceBundles/CPUWatcherPrefs.bundle/Root.plist
          if [ ! -f "$ROOT" ]; then
            echo "FATAL: 面板 bundle 少了 Root.plist —— 面板会整片空白"
            ls -la stage/var/jb/Library/PreferenceBundles/CPUWatcherPrefs.bundle/
            exit 1
          fi
          echo "OK: Root.plist 已就位"

      - name: "Guard 7/7: 版本号三处必须一致（control / bundle / 源码宏）"
        run: |
          V_CONTROL=$(grep '^Version:' stage/DEBIAN/control | awk '{print $2}' | tr -d '\r\n ')
          V_BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
                     stage/var/jb/Library/PreferenceBundles/CPUWatcherPrefs.bundle/Info.plist | tr -d '\r\n ')
          V_SRC=$(grep -o 'CW_VERSION_STRING "[^"]*"' src/shared/CWCommon.h | sed 's/.*"\(.*\)"/\1/')
          echo "control=[$V_CONTROL]  bundle=[$V_BUNDLE]  源码宏=[$V_SRC]"
          if [ "$V_CONTROL" != "$V_BUNDLE" ] || [ "$V_CONTROL" != "$V_SRC" ]; then
            echo "FATAL: 三处版本号不一致，面板会显示旧版本"
            exit 1
          fi
          echo "OK: 版本号三处一致"

      - name: Pack deb
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p packages
          DEB="packages/com.axs.cpuwatcher_${VERSION}_iphoneos-arm64.deb"
          dpkg-deb --root-owner-group -b stage "$DEB"
          echo "=== 最终产物 ==="
          ls -la packages/
          echo "=== deb 内文件清单 ==="
          dpkg-deb -c "$DEB" | grep -E "cpuwatchctl|TweakInject|PreferenceBundles|postinst"
          # 复核 setuid 是否活着进了 deb（dpkg-deb 打包时最容易吃掉权限位）
          if ! dpkg-deb -c "$DEB" | grep -E "^.{3}s" | grep -q cpuwatchctl; then
            echo "FATAL: deb 里的 cpuwatchctl 丢了 setuid 位"
            exit 1
          fi
          echo "OK: deb 内 cpuwatchctl 保留了 setuid"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPUWatcher-deb
          path: packages/*.deb
